<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Quest | To Be & To Have · Grade 5</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#162a45;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}.top{background:#182e56;color:white;padding:18px max(18px,calc((100vw - 1100px)/2));position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:clamp(21px,3vw,30px)}.top p{margin:5px 0;color:#d4e3f8}.main{max-width:1100px;margin:20px auto;padding:0 16px 50px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 2px 14px}.tab{flex:0 0 auto;background:white;border:2px solid #d8e2f0;border-radius:12px;padding:11px 14px;color:#193459;font-weight:700;cursor:pointer}.tab.active{background:#3156c5;border-color:#3156c5;color:white}.sheet{background:white;border:1px solid #e0e7f1;border-radius:20px;padding:clamp(18px,3vw,33px);box-shadow:0 9px 30px #243e6420}h2{margin:0;font-size:26px}.meta{color:#566981}.rule{background:#e9f2ff;border-left:6px solid #3978da;border-radius:12px;padding:17px;line-height:1.6;margin:20px 0}.instruction{background:#fff4ce;border:3px solid #e6aa25;border-radius:15px;padding:18px 20px;margin:20px 0;box-shadow:0 4px 0 #ebdba7}.instruction-label{font-size:13px;font-weight:900;color:#764a00;letter-spacing:.07em}.instruction-main{font-size:clamp(18px,2.5vw,23px);font-weight:850;color:#302303;margin:7px 0}.choice-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.choice{background:white;border:2px solid #ca921a;border-radius:9px;padding:6px 12px;font-size:18px;font-weight:800;color:#643e00}.instruction-note{margin-top:10px;color:#624a19;font-weight:600}.blank{background:#fff0b4;border-bottom:3px solid #d28a0c;padding:1px 6px;border-radius:5px;color:#6b4300}.question{border-top:1px solid #e7ecf4;padding:17px 0}.qtitle{font-weight:650;margin-bottom:10px;line-height:1.5}.words{background:#f5f7fb;border-radius:8px;padding:11px 14px;display:inline-block;font-weight:650;color:#234d8e}.answer{width:100%;max-width:570px;padding:12px 14px;border:2px solid #d8e2f0;border-radius:10px;font-size:17px}.answer:focus{outline:2px solid #3156c5}.answer.correct{border-color:#219067;background:#f2fff8}.answer.wrong{border-color:#c34d54;background:#fff8f8}.feedback{font-size:14px;font-weight:650;margin-top:7px}.ok{color:#08764d}.bad{color:#b23c45}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}.btn{border:0;padding:12px 19px;border-radius:11px;background:#3156c5;color:white;font-size:15px;font-weight:750;cursor:pointer}.btn.secondary{background:#e9eef8;color:#203b63}.btn:focus-visible,.tab:focus-visible{outline:3px solid #eea747;outline-offset:3px}.score{padding:12px 15px;border-radius:12px;background:#eaf6ef;color:#125f3e;font-weight:800;margin-top:14px}.summary{margin-left:auto;color:#24496e;padding:8px 12px;border:1px solid #d9e3f1;border-radius:12px}.progress{height:8px;background:#dfe8f5;border-radius:10px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#7ab5ff;transition:width .2s}@media print{.top{position:static;background:white;color:black}.tabs,.actions,.feedback,.summary{display:none!important}.sheet{border:0;box-shadow:none}.question{break-inside:avoid}.answer{border:0;border-bottom:1px solid black;border-radius:0}}
</style></head><body><header class="top"><h1>📚 Grammar Quest: TO BE & TO HAVE</h1><p>Grade 5 ESL · 9 tasks · 100 sentences · Positive, negative & questions</p><div class="progress"><div class="bar" id="progressbar"></div></div></header><main class="main"><nav class="tabs" id="tabs" aria-label="Choose task"></nav><section class="sheet" id="task"></section></main><script>
const TASKS=[{"title":"TO BE · Positive","type":"gap","rule":"Use am with I, is with he/she/it, and are with you/we/they.","choices":["am","is","are"],"items":[["I ___ eleven years old.","am"],["My best friend ___ very funny.","is"],["We ___ in the same class.","are"],["My parents ___ at work.","are"],["She ___ good at English.","is"],["You ___ very kind.","are"],["My little brother ___ seven years old.","is"],["They ___ happy today.","are"],["Our classroom ___ very big.","is"],["I ___ ready for the lesson.","am"]]},{"title":"TO BE · Negative","type":"gap","rule":"Put not after am/is/are. You can write isn't and aren't.","choices":["am not","isn't","aren't"],"items":[["I ___ tired today.","am not"],["My sister ___ at home.","isn't"],["We ___ late for school.","aren't"],["The children ___ hungry.","aren't"],["He ___ my brother.","isn't"],["You ___ wrong.","aren't"],["My shoes ___ dirty.","aren't"],["It ___ cold outside.","isn't"],["They ___ in the playground.","aren't"],["I ___ afraid of dogs.","am not"]]},{"title":"TO BE · Questions","type":"gap","rule":"Put Am/Is/Are BEFORE the subject: Are you ready? Is she happy?","choices":["Am","Is","Are"],"items":[["___ you twelve years old?","Are"],["___ your best friend in your class?","Is"],["___ they from Denmark?","Are"],["___ your teacher happy today?","Is"],["___ we ready to start?","Are"],["___ I in the right classroom?","Am"],["___ your parents at home?","Are"],["___ English your favourite subject?","Is"],["___ your friends good at football?","Are"],["___ it sunny outside?","Is"]]},{"title":"TO HAVE · Positive","type":"gap","rule":"Use has with he/she/it, and have with I/you/we/they.","choices":["have","has"],"items":[["I ___ a new schoolbag.","have"],["My brother ___ a bicycle.","has"],["We ___ English on Monday.","have"],["She ___ two cats.","has"],["They ___ a big garden.","have"],["My best friend ___ a little sister.","has"],["You ___ a beautiful pencil case.","have"],["Our teacher ___ a computer.","has"],["My grandparents ___ a dog.","have"],["He ___ brown eyes.","has"]]},{"title":"TO HAVE · Negative","type":"gap","rule":"Use don't have with I/you/we/they and doesn't have with he/she/it. After doesn't always write have.","choices":["don't have","doesn't have"],"items":[["I ___ a pet.","don't have"],["My sister ___ a bicycle.","doesn't have"],["We ___ homework today.","don't have"],["He ___ a smartphone.","doesn't have"],["They ___ any brothers or sisters.","don't have"],["My friend ___ a computer.","doesn't have"],["You ___ a red pencil.","don't have"],["Our school ___ a swimming pool.","doesn't have"],["My parents ___ a car.","don't have"],["Emma ___ long hair.","doesn't have"]]},{"title":"TO HAVE · Questions","type":"gap","rule":"Start questions with Do (I/you/we/they) or Does (he/she/it). Always use have, not has, after Does.","choices":["Do","Does"],"items":[["___ you have a pet?","Do"],["___ your brother have a bicycle?","Does"],["___ they have English today?","Do"],["___ your best friend have a sister?","Does"],["___ we have homework?","Do"],["___ your parents have a car?","Do"],["___ she have a favourite book?","Does"],["___ you have a computer at home?","Do"],["___ your teacher have a dog?","Does"],["___ Tom have blue eyes?","Does"]]},{"title":"Mixed Grammar","type":"gap","rule":"TO BE: am/is/are, with not for negatives; questions start Am/Is/Are. TO HAVE: have/has; don't/doesn't have; questions start Do/Does.","choices":["am","is","are","have","has","do","does","don't","doesn't"],"items":[["My best friend ___ twelve years old.","is"],["___ your sister have a bicycle?","Does"],["We ___ not at school on Sundays.","are"],["I ___ two brothers and one sister.","have"],["She ___ have a smartphone.","doesn't"],["___ you happy with your new teacher?","Are"],["My parents ___ a big car.","have"],["He ___ very good at basketball.","is"],["___ they have a dog at home?","Do"],["I ___ not afraid of spiders.","am"],["Emma ___ long brown hair.","has"],["My friends ___ in the playground.","are"],["___ your brother good at football?","Is"],["We ___ have any homework today.","don't"],["___ your teacher have a cat?","Does"],["My little sister ___ not very tall.","is"],["They ___ three computers at home.","have"],["___ it cold outside today?","Is"],["Tom ___ have any sisters.","doesn't"],["___ you have English on Fridays?","Do"]]},{"title":"Put Words in Order","type":"order","rule":"Positive: subject + verb. Negative: use not or don't/doesn't have. Questions: start with Am/Is/Are or Do/Does. Add capital letters and punctuation.","choices":[],"items":[["is / my / best friend / very funny","My best friend is very funny."],["you / have / do / a pet / ?","Do you have a pet?"],["not / we / are / tired / today","We are not tired today."],["has / a new bicycle / she","She has a new bicycle."],["your brother / is / at home / ?","Is your brother at home?"],["doesn't / he / a smartphone / have","He doesn't have a smartphone."],["they / are / good at football / ?","Are they good at football?"],["don't / we / any homework / have / today","We don't have any homework today."],["does / your sister / a dog / have / ?","Does your sister have a dog?"],["my parents / are / not / at work / today","My parents are not at work today."]]},{"title":"Translate Danish → English","type":"translate","rule":"Use to be and to have correctly. Write a complete English sentence. Contractions are fine.","choices":[],"items":[["Jeg er 11 år gammel.","I am 11 years old."],["Hun har en hund.","She has a dog."],["Vi er ikke trætte.","We are not tired."],["Har du en cykel?","Do you have a bicycle?"],["Han er min bedste ven.","He is my best friend."],["De har ikke en kat.","They don't have a cat."],["Er din søster hjemme?","Is your sister at home?"],["Min bror har blåt hår.","My brother has blue hair."],["Jeg har ikke en computer.","I don't have a computer."],["Har hun en lillebror?","Does she have a little brother?"]]}];
const DIR=["Fill in each gap with am, is or are.","Fill in each gap with am not, isn't or aren't.","Complete each question with Am, Is or Are.","Fill in each gap with have or has.","Fill in each gap with don't have or doesn't have.","Complete each question with Do or Does.","Choose the correct missing word or words.","Put ALL the words in the correct order.","Translate each Danish sentence into English."];
let current=0;const state=TASKS.map(t=>({answers:Array(t.items.length).fill(""),checked:false}));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(v){return String(v||"").trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"").replace(/\bisn't\b/g,"is not").replace(/\baren't\b/g,"are not").replace(/\bdoesn't\b/g,"does not").replace(/\bdon't\b/g,"do not")}
function correct(t,i,v){let a=t.items[i][1];return norm(v)===norm(a)||(current===8&&i===3&&norm(v)===norm("Do you have a bike?"))}
function render(){let t=TASKS[current],s=state[current];$('tabs').innerHTML=TASKS.map((x,i)=>'<button class="tab '+(i===current?'active':'')+'" data-index="'+i+'">'+(i+1)+'. '+esc(x.title)+'</button>').join("");document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=+b.dataset.index;render()});
let instruction=current<7?"Write ONLY the missing word(s).":current===7?"Write the complete sentence. Use capital letters and punctuation.":"Write a complete sentence in English.";
let out='<h2>Task '+(current+1)+': '+esc(t.title)+'</h2><p class="meta">'+t.items.length+' sentences</p><div class="instruction"><div class="instruction-label">✏️ WHAT TO WRITE IN THIS TASK</div><div class="instruction-main">'+esc(DIR[current])+'</div>'+(t.choices.length?'<div class="choice-list">'+t.choices.map(w=>'<span class="choice">'+esc(w)+'</span>').join("")+'</div>':'')+'<div class="instruction-note">'+instruction+'</div></div><div class="rule"><b>GRAMMAR RULE:</b> '+esc(t.rule)+'</div>';
t.items.forEach(([prompt,answer],i)=>{let good=correct(t,i,s.answers[i]);let q=t.type==='order'?'<span class="words">'+esc(prompt)+'</span>':esc(prompt).replace(/___/g,'<span class="blank">_____</span>');out+='<div class="question"><div class="qtitle">'+(i+1)+'. '+q+'</div><input class="answer '+(s.checked?(good?'correct':'wrong'):'')+'" data-q="'+i+'" aria-label="Answer '+(i+1)+'" autocomplete="off" spellcheck="false" placeholder="'+(t.type==='gap'?'Type missing word(s)...':'Write the full English sentence...')+'" value="'+esc(s.answers[i])+'">'+(s.checked?'<div class="feedback '+(good?'ok':'bad')+'">'+(good?'✓ Correct':'✗ Model answer: '+esc(answer))+'</div>':'')+'</div>'});
if(s.checked)out+='<div class="score" role="status">Score: '+t.items.filter((_,i)=>correct(t,i,s.answers[i])).length+' / '+t.items.length+'</div>';
out+='<div class="actions"><button class="btn" id="check">Check answers</button><button class="btn secondary" id="clear">Clear this task</button>'+(current>0?'<button class="btn secondary" id="prev">← Previous</button>':'')+(current<TASKS.length-1?'<button class="btn" id="next">Next task →</button>':'')+'<span class="summary" id="count"></span></div>';$('task').innerHTML=out;
document.querySelectorAll("input.answer").forEach(x=>x.oninput=e=>{s.answers[+e.target.dataset.q]=e.target.value;if(s.checked){s.checked=false;document.querySelectorAll(".feedback,.score").forEach(y=>y.remove());document.querySelectorAll(".answer").forEach(y=>y.classList.remove("correct","wrong"))}counts()});
$('check').onclick=()=>{s.checked=true;render()};$('clear').onclick=()=>{s.answers.fill("");s.checked=false;render()};if($('prev'))$('prev').onclick=()=>{current--;render();scrollTo(0,0)};if($('next'))$('next').onclick=()=>{current++;render();scrollTo(0,0)};counts()}
function counts(){$('count').textContent=state[current].answers.filter(v=>v.trim()).length+' / '+state[current].answers.length+' answered';$('progressbar').style.width=state.reduce((n,t)=>n+t.answers.filter(v=>v.trim()).length,0)+'%'}render();
</script></body></html>
